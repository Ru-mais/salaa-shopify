name: Theme CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
